# Runs the full check on every PR to main and every push to main. A push to main that passes
# the check then deploys to production (job `deploy`).
# `check` uses no secrets: integration tests run the Worker locally in workerd/Miniflare.
# The ruleset on main requires the job named `check`. Renaming it breaks merges until the ruleset is updated.
name: CI

on:
  pull_request:
    branches: [main]
    # `edited` covers a PR whose base is changed to main. Title or body edits also re-run the
    # check. Never skip the job on those: a skipped required check counts as passing.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run check

  # Production deploy: remote D1 migrations, then the Worker. Runs only for a push to main
  # (a merged PR) after `check` passes on the same commit. Credentials come from the GitHub
  # environment `production`: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://lackey.jsulz.com
    # One deploy at a time, in merge order. A queued deploy waits instead of cancelling one in progress.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply research-lackey --remote
      - name: Deploy
        run: npm run deploy
